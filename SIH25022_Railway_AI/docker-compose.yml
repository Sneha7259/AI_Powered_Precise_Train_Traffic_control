services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: railai
      POSTGRES_USER: railai
      POSTGRES_PASSWORD: railai_dev_password
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U railai -d railai"]
      interval: 5s
      timeout: 5s
      retries: 10
  backend:
    build: ./backend
    ports: ["8080:8080"]
    depends_on:
      postgres:
        condition: service_healthy
  ml-service:
    build: ./ml-service
    ports: ["8001:8001"]
  frontend:
    build: ./frontend
    ports: ["5173:5173"]
    depends_on: [backend]
volumes:
  pgdata:
